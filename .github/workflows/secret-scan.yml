# Scans the whole git history for accidentally committed secrets (keys, tokens, connection strings) on every push
# and pull request. It is a separate workflow from the deploy, so a finding turns this check red and emails you but
# never stops or changes a deploy. Findings are redacted in the log, so a secret is never printed (important on a public repo).
#
# Put this file at .github/workflows/secret-scan.yml
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          VERSION=8.21.2
          SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan for secrets
        run: ./gitleaks detect --source . --redact --no-banner --verbose --exit-code 1
